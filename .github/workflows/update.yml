name: Atualizar calendário

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_fpa_calendar.py
      - run: python3 fpa_calendar.py 2> stderr.txt || (cat stderr.txt; exit 1)
      - name: Abrir issue para pavilhões sem morada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -n 's/^Pavilhão sem morada: //p' stderr.txt | while IFS= read -r venue; do
            title="Pavilhão sem morada: $venue"
            gh issue list --state open --limit 100 --json title -q '.[].title' | grep -qxF "$title" ||
              gh issue create --title "$title" --body "Acrescenta a morada de \`$venue\` ao \`pavilhoes.json\`. Até lá o calendário mostra só o código da FPA."
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add padroense.ics classificacao.json
          git diff --cached --quiet || (git commit -m "Atualizar calendário" && git push)
