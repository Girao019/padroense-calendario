<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padroense Andebol</title>
<link rel="icon" href="data:,">
<meta name="description" content="Calendário dos jogos de seniores masculinos do Padroense FC, sempre atualizado a partir da FPA.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5f6672; --line: #e3e6eb;
    --accent: #c8102e; --accent-text: #ffffff; --win: #1f7a3f; --loss: #b3261e; --draw: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #e5334f; --accent-text: #ffffff; --win: #4cc27a; --loss: #f0736a; --draw: #9aa1ad;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.75rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 32px 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); margin: 4px 0 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--card); color: var(--text); text-decoration: none; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .next .when { color: var(--accent); font-weight: 700; }
  .next .teams { font-size: 1.3rem; font-weight: 700; margin: 4px 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.game { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
  li.game:first-child { border-top: 0; }
  .date { font-weight: 600; font-size: .95rem; }
  .date small { display: block; color: var(--muted); font-weight: 400; }
  .teams { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .meta a { color: inherit; }
  .tag { font-size: .75rem; font-weight: 700; color: var(--accent); margin-right: 6px; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .V { color: var(--win); } .D { color: var(--loss); } .E { color: var(--draw); }
  .list { padding: 0; }
  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
  footer a { color: inherit; }
  @media (max-width: 480px) { li.game { grid-template-columns: 64px 1fr; } .score { grid-column: 2; justify-self: start; padding-left: 0; } }
</style>
</head>
<body>
<main>
  <h1>Padroense Andebol</h1>
  <p class="sub">Seniores masculinos: campeonato e Taça. Atualizado automaticamente a partir da FPA.</p>
  <div class="actions">
    <a class="btn primary" id="google" href="#">Adicionar ao Google Calendar</a>
    <a class="btn" id="webcal" href="#">iPhone / Outlook</a>
    <button class="btn" id="copy" type="button">Copiar link</button>
  </div>

  <h2>Próximo jogo</h2>
  <div class="card next" id="next">A carregar…</div>

  <h2>Calendário</h2>
  <div class="card list"><ul id="upcoming"></ul></div>

  <h2>Resultados</h2>
  <div class="card list"><ul id="results"></ul></div>

  <footer>Dados: <a href="https://portal.fpa.pt/clube/id/878">Federação de Andebol de Portugal</a>. Duração dos jogos estimada em 1h30.</footer>
</main>
<script>
const feed = new URL("padroense.ics", location.href).href;
const webcal = feed.replace(/^https?:/, "webcal:");
document.getElementById("google").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcal);
document.getElementById("webcal").href = webcal;
document.getElementById("copy").onclick = async (e) => {
  try { await navigator.clipboard.writeText(feed); e.target.textContent = "Link copiado"; }
  catch { prompt("Copia este link:", feed); }
};

const unescape = (s) => s.replace(/\\n/gi, "\n").replace(/\\([,;\\])/g, "$1");
function parse(text) {
  const lines = text.replace(/\r?\n[ \t]/g, "").split(/\r?\n/);
  const events = []; let ev = null;
  for (const line of lines) {
    if (line === "BEGIN:VEVENT") ev = {};
    else if (line === "END:VEVENT") { events.push(ev); ev = null; }
    else if (ev) {
      const i = line.indexOf(":");
      ev[line.slice(0, i).split(";")[0]] = unescape(line.slice(i + 1));
    }
  }
  return events.map((e) => {
    const d = e.DTSTART;
    const start = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), +d.slice(9, 11), +d.slice(11, 13)));
    const cup = e.SUMMARY.startsWith("Taça: ");
    const s = e.SUMMARY.replace(/^Taça: /, "");
    const m = s.match(/^(.+?) (\d+)-(\d+) (.+)$/) || s.match(/^(.+?) vs (.+)$/);
    const [home, away, gh, ga] = m.length === 5 ? [m[1], m[4], +m[2], +m[3]] : [m[1], m[2], null, null];
    return { start, cup, home, away, gh, ga, location: e.LOCATION || "" };
  }).sort((a, b) => a.start - b.start);
}

const tz = { timeZone: "Europe/Lisbon" };
const fmtDay = new Intl.DateTimeFormat("pt-PT", { ...tz, day: "2-digit", month: "2-digit" });
const fmtWeekday = new Intl.DateTimeFormat("pt-PT", { ...tz, weekday: "long" });
const fmtTime = new Intl.DateTimeFormat("pt-PT", { ...tz, hour: "2-digit", minute: "2-digit" });
const fmtLong = new Intl.DateTimeFormat("pt-PT", { ...tz, weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
const maps = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const isUs = (team) => /PADROENSE/i.test(team);

function where(g) {
  const p = el("div", "meta");
  const a = el("a", null, g.location); a.href = maps(g.location); a.target = "_blank"; a.rel = "noopener";
  p.append(a);
  return p;
}

function row(g) {
  const li = el("li", "game");
  const date = el("div", "date", fmtDay.format(g.start));
  date.append(el("small", null, `${fmtWeekday.format(g.start).slice(0, 3)}. ${fmtTime.format(g.start)}`));
  const mid = el("div");
  const teams = el("div", "teams");
  if (g.cup) teams.append(el("span", "tag", "TAÇA"));
  teams.append(`${g.home} - ${g.away}`);
  mid.append(teams, where(g));
  li.append(date, mid);
  if (g.gh != null) {
    const [us, them] = isUs(g.home) ? [g.gh, g.ga] : [g.ga, g.gh];
    const r = us > them ? "V" : us < them ? "D" : "E";
    li.append(el("span", "score " + r, `${r} ${g.gh}-${g.ga}`));
  }
  return li;
}

fetch(feed, { cache: "no-cache" }).then((r) => r.text()).then((text) => {
  const games = parse(text);
  const now = Date.now() - 2 * 3600e3;
  const upcoming = games.filter((g) => g.gh == null && g.start >= now);
  const results = games.filter((g) => g.gh != null).reverse();

  const next = document.getElementById("next");
  next.textContent = "";
  if (upcoming.length) {
    const g = upcoming[0];
    next.append(el("div", "when", fmtLong.format(g.start)),
                el("div", "teams", (g.cup ? "Taça: " : "") + `${g.home} vs ${g.away}`), where(g));
  } else next.textContent = "Sem jogos marcados.";

  document.getElementById("upcoming").append(...upcoming.map(row));
  document.getElementById("results").append(...results.map(row));
}).catch(() => { document.getElementById("next").textContent = "Não foi possível carregar o calendário."; });
</script>
</body>
</html>
